<!-- ═══ Dark mode pre-init ══════════════════════════════════════════════
     Inject class .dark TRƯỚC tất cả script (React, bg-settings, app.js).
     Đảm bảo isDarkActive() trong background-settings.js đọc đúng ngay
     lần đầu — tránh race condition với React useEffect.
     ════════════════════════════════════════════════════════════════════ -->
<script>
(function(){
  var dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
  try{
    var stored=localStorage.getItem('learnsy_dark');
    if(stored==='1')dark=true;
    else if(stored==='0')dark=false;
  }catch(e){}
  if(dark){
    document.documentElement.classList.add('dark');
    document.body&&document.body.classList.add('dark');
  }
  if(!document.body){
    document.addEventListener('DOMContentLoaded',function(){
      if(dark)document.body.classList.add('dark');
    },{once:true});
  }
  window.__darkInit=dark;
})();
</script>

<!-- Supabase vẫn load qua CDN (không có npm package tương đương dễ dùng) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // 🔒 Credentials được đọc từ Cloudflare Pages Environment Variables.
  //    Thiết lập tại: Pages → Settings → Environment variables
  //      SUPA_URL, SUPA_KEY, UPSTASH_URL, UPSTASH_TOKEN, (CACHE_KEY)

  const CACHE_KEY='lessons_cache';
  const CACHE_TTL=300; // cache 5 phút

  function trackEvent(data){
    // Kèm token phiên (nếu có) để server đếm SỐ HỌC SINH hoạt động/ngày (HyperLogLog); không có token vẫn đếm lượt.
    var headers={'Content-Type':'application/json'};
    try{var tk=window.LearnsySession&&window.LearnsySession.getToken&&window.LearnsySession.getToken();if(tk)headers['Authorization']='Bearer '+tk;}catch(e){}
    fetch('/api/analytics',{method:'POST',headers:headers,body:JSON.stringify(data)}).catch(()=>{});
  }

  // Upstash được proxy qua /api/cache — UPSTASH_TOKEN không bao giờ về client
  async function upstashCmd(...args){
    try{
      const r=await fetch('/api/cache',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(args)});
      return(await r.json()).result;
    }catch(e){return null;}
  }
  window.upstashCmd=upstashCmd; // expose cho avatar.js và các module khác

  // 🔑 Đặt giá trị này = CONFIG_SECRET trong Cloudflare Pages env vars
  //    Tạo key mới: openssl rand -hex 32
  window.__ENC_KEY='cf71184c6108936b852ca4f0fca82fa873bf4ce0f9f26e44afc17edbe6c5ca3f';

  /** Giải mã AES-256-GCM response từ /api/config */
  async function _decryptCfg(enc){
    function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
    function h2b(h){return Uint8Array.from({length:h.length>>1},(_,i)=>parseInt(h.slice(i*2,i*2+2),16));}
    const key=await crypto.subtle.importKey(
      'raw',h2b(window.__ENC_KEY),{name:'AES-GCM'},false,['decrypt']);
    const plain=await crypto.subtle.decrypt(
      {name:'AES-GCM',iv:b64(enc.iv),tagLength:128},key,b64(enc.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  // Supabase — fetch config mã hóa → giải mã → init client
  window.__configReady=(async()=>{
    try{
      const enc=await fetch('/api/config').then(r=>r.json());
      const cfg=await _decryptCfg(enc);
      window.supa=supabase.createClient(cfg.supaUrl||'',cfg.supaKey||'');
    }catch(e){
      console.error('[config] Lỗi load/giải mã config:',e);
    }
  })();
</script>
